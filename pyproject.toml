[project]
name = "multilinguarag"
version = "0.1.0"
description = "A multilingual RAG knowledge assistant for Chinese, Japanese, and English documents."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["rag", "multilingual", "qwen3", "qdrant", "docling", "llm"]
dependencies = [
  "docling==2.119.0",
  "openai==3.0.0",
  "python-dotenv==1.2.2",
  "qdrant-client==1.19.0",
  "sentence-transformers==5.7.0",
  "streamlit==1.61.1",
  "transformers>=4.51.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[project.scripts]
multilinguarag-ingest = "multilinguarag.cli:ingest_main"
multilinguarag-query = "multilinguarag.cli:query_main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multilinguarag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
